[project]
name = "topfed"
version = "0.1.0"
description = "Trust scores and bounded-weight aggregation under poisoning in federated learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flwr-datasets>=0.6.0",
    "flwr[simulation]>=1.29.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.9",
    "mypy>=1.19.1",
    "numpy>=2.4.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topfed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"

# scipy, scikit-learn, flwr-datasets, and torchvision ship no type stubs /
# py.typed marker; suppress the import-untyped noise so real type errors stay
# visible.
[[tool.mypy.overrides]]
module = [
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "flwr_datasets",
    "flwr_datasets.*",
    "torchvision",
    "torchvision.*",
]
ignore_missing_imports = true
