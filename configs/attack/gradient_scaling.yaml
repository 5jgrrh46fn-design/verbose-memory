# Gradient-scaling model poisoning: amplify the malicious delta by ``factor``
# without modifying training data or adding an anomaly-evasion loss term.
# attack-budget sweep covers factor ∈ {2.0, 5.0, 10.0}; the default
# below is the middle of that range.

kind: gradient_scaling

poisoner: null
loss_augmenter: null

update_manipulator:
  _target_: topfed.attacks.model.gradient_scale.GradientScalingManipulator
  factor: 5.0

schedule:
  _target_: topfed.attacks.schedule.AlwaysAttack

assignment:
  fraction: 0.10
