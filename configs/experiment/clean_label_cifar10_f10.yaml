# @package _global_
# Clean-label (Label-Consistent backdoor) on CIFAR-10, Dirichlet(alpha=0.5),
# N=100 / K=10, f=10% compromised.
# Sweep seeds with ``--multirun federation.seed=0,1,2,3,4``.

defaults:
  - override /dataset: cifar10
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: clean_label

experiment: clean_label_cifar10_f10

attack:
  assignment:
    fraction: 0.10
