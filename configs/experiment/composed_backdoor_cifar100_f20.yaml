# CIFAR-100, Dirichlet(alpha=0.5), N=100 / K=10, f=20% compromised. Sweep
# the attacker's knobs with
# ``attack.update_manipulator.manipulators.0.cosine_target`` and
# ``attack.update_manipulator.manipulators.1.target_norm``.

defaults:
  - override /dataset: cifar100
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: composed_backdoor

experiment: composed_backdoor_cifar100_f20

attack:
  assignment:
    fraction: 0.20
