# @package _global_
# Fang et al. median / trimmed-mean attack (partial knowledge) on CIFAR-10,
# Dirichlet(alpha=0.5), N=100 / K=10, f=20% compromised. Untargeted: read
# clean accuracy. Sweep seeds with ``--multirun federation.seed=0,1,2,3,4``.

defaults:
  - override /dataset: cifar10
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: fang

experiment: fang_cifar10_f20

attack:
  assignment:
    fraction: 0.20
