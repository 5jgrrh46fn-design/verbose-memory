# @package _global_
# Server-rooted-trust-aware (FLTrust-tailored) backdoor on CIFAR-10,
# Dirichlet(alpha=0.5), N=100 / K=10, f=20% compromised. Pair with the FLTrust
# defense: ``+baseline=fltrust``. Sweep seeds with
# ``--multirun federation.seed=0,1,2,3,4`` and the attacker's best-response knob
# with ``attack.update_manipulator.cosine_target=0.5,0.7,0.9,0.95``.

defaults:
  - override /dataset: cifar10
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: fltrust_backdoor

experiment: fltrust_backdoor_cifar10_f20

attack:
  assignment:
    fraction: 0.20
