# @package _global_
# Sign-flipping model poisoning on CIFAR-10, Dirichlet(alpha=0.5),
# N=100 / K=10, f=10% compromised. Sweep seeds with
# ``--multirun federation.seed=0,1,2,3,4``.

defaults:
  - override /dataset: cifar10
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: sign_flip

experiment: sign_flip_cifar10_f10

attack:
  assignment:
    fraction: 0.10
