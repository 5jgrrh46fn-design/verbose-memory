defaults:
  - override /dataset: cifar10
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: gradient_scaling

experiment: gradient_scaling_cifar10_f40

attack:
  assignment:
    fraction: 0.40
