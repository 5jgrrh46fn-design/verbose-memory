# @package _global_
# Server peak-memory block: the CIFAR-100 f=10% backdoor setting for 5 rounds with
# memory profiling on. Tensor shapes are the same every round, so a few rounds
# give the peak; host tracing slows the server, so these runs are kept apart
# from the timing runs.

defaults:
  - override /dataset: cifar100
  - override /partition: dirichlet_alpha_0.5
  - override /federation: default
  - override /attack: backdoor

experiment: overhead_memory_cifar100

federation:
  num_rounds: 5
  profile_memory: true

attack:
  assignment:
    fraction: 0.10
