# @package _global_
# Uncapped trust weights (TOPSIS score, CRITIC weighting) inside a weighted
# geometric median: the cap ablation of topsis_capped_weighted_geomedian.
defense:
  scorer:
    weighting: critic
  integrator:
    _target_: topfed.integration.mechanisms.ScoreWeight
    alpha: 1.0
  base: geometric_median
  geometric_median:
    nu: 1.0e-6
    max_iter: 10
